<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Conversion Matrix</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="particleCanvas"></canvas>
    <main class="container">
      <header class="header">
        <h1 class="title">Apex Matrix</h1>
        <p class="subtitle">High-Fidelity Conversion Architecture</p>
      </header>
      <section class="card">
        <h2>System Status</h2>
        <div class="metrics">
          <div class="metric">
            <span class="value" id="convRate">0</span>
            <span class="label">Conversion Rate</span>
          </div>
          <div class="metric">
            <span class="value" id="latency">0</span>
            <span class="label">Latency (ms)</span>
          </div>
        </div>
        <button id="engageBtn" class="btn-primary">Initialize Protocol</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
